services:
  dlp:
    image: dlp:${VERSION:-1.0.0}
    build:
      context: .
      args:
        APP_VERSION: ${VERSION:-1.0.0}
    restart: unless-stopped
    environment:
      VIRTUAL_HOST: dlp.destroyer.home.net
    dns:
      - ${PIHOLE_DNS:?Set PIHOLE_DNS to Pi-hole's stable IP}
    networks:
      - pihole

networks:
  pihole:
    external: true

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video downloader</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <main class="shell">
        <a class="brand" href="/">
            <span class="brand-mark" aria-hidden="true">↓</span>
            <span>video downloader</span>
        </a>

        <section class="hero">
            <p class="eyebrow">Simple. Private. Direct.</p>
            <h1>Download what<br><em>you want.</em></h1>
            <p class="intro">Paste a video link and download the media directly to your device.</p>
        </section>

        <section class="upload-card" aria-labelledby="download-heading">
            <h2 id="download-heading" class="visually-hidden">Download a video</h2>
            <form id="download-form" action="/initiate" method="POST">
                <label class="url-field" for="videoURL">
                    <span class="upload-icon" aria-hidden="true">↗</span>
                    <span class="file-copy">
                        <strong>Video URL</strong>
                        <small>Paste a link from a supported site</small>
                    </span>
                </label>
                <input type="url" id="videoURL" name="videoURL" placeholder="https://..." required>
                <button type="submit" class="primary-button">Start download <span aria-hidden="true">→</span></button>
            </form>

            <div id="progress-container" class="progress-panel" hidden>
                <div class="progress-label">
                    <span>Download progress</span>
                    <span><span id="progress">0.0</span>%</span>
                </div>
                <progress id="progress-bar" value="0" max="100">0%</progress>
            </div>
        </section>

        <footer>Downloads are processed on this server.</footer>
    </main>
    <script>
        document.getElementById('download-form').addEventListener('submit', function (event) {
            event.preventDefault();

            const formData = new FormData(event.target);
            fetch('/initiate', {
                method: 'POST',
                body: formData
            })
                .then(response => response.json())
                .then(data => {
                    if (data.status === "Download started") {
                        document.getElementById('progress-container').hidden = false;

                        const eventSource = new EventSource('/progress');
                        eventSource.onmessage = function (event) {
                            const progress = event.data;

                            if (progress.startsWith('ERROR:')) {
                                console.error(progress.slice(6));
                                eventSource.close();
                                return;
                            }

                            if (!progress.startsWith("yolo")) {
                                const percentage = Number.parseFloat(progress);
                                const safePercentage = Number.isFinite(percentage) ? percentage : 0;
                                document.getElementById('progress').textContent = safePercentage.toFixed(1);
                                document.getElementById('progress-bar').value = safePercentage;
                            } else {
                                document.getElementById('progress').textContent = '100.0';
                                document.getElementById('progress-bar').value = 100;
                                window.location.replace("/download/" + progress);
                                eventSource.close();
                            }
                        };

                        eventSource.onerror = function () {
                            eventSource.close();
                        };
                    }
                });
        });
    </script>
</body>

</html>
